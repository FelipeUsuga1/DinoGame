<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>DinoGame — Carrera cuando no hay intenet</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png?v=20260711">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png?v=20260711">
  <link rel="shortcut icon" href="assets/icons/favicon.ico?v=20260711">
  <link rel="apple-touch-icon" href="assets/icons/favicon.png?v=20260711">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="game-shell">
    <section class="canvas-wrap" aria-label="Juego DinoGame">
      <canvas id="gameCanvas" tabindex="0" aria-label="Juego de carrera DinoGame"></canvas>
      <button id="muteButton" class="mute" type="button" aria-pressed="false">SONIDO: ON</button>
      <button id="restartButton" class="restart" type="button" hidden>JUGAR DE NUEVO</button>
    </section>
    <nav class="touch-controls" aria-label="Controles táctiles">
      <button id="duckButton" class="touch-control" type="button" aria-label="Mantener para agacharse">AGACHARSE</button>
      <button id="jumpButton" class="touch-control" type="button" aria-label="Saltar">SALTAR</button>
    </nav>
  </main>
  <script type="module" src="js/main.js?v=20260711b"></script>
</body>
</html>
